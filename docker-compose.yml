version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: osdepym-postgres
    environment:
      POSTGRES_DB: osdepym
      POSTGRES_USER: osdepym
      POSTGRES_PASSWORD: osdepym
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: osdepym-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: osdepym
      RABBITMQ_DEFAULT_PASS: osdepym
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
